# =============================================================================
# GHR app deployment workflow
#
# OIDC CONFIGURATION (read before enabling):
#   This workflow authenticates to Azure with OIDC federated credentials —
#   no stored client secrets. The federated credential on the deployment app
#   registration must trust this repository's `sub` claim.
#
#   WARNING: GitHub issues IMMUTABLE subject claims (numeric owner/repo IDs
#   instead of names) for repositories created after 2026-07-15. An org-wide
#   wildcard like `repo:your-org/*` may NOT match new repos. Verify the actual
#   `sub` format for this repo before relying on a wildcard credential:
#     gh api /repos/<org>/<repo>/actions/oidc/customization/sub
#   If in doubt, create a per-repo federated credential with the exact subject.
#
#   Secrets come from GitHub ORG secrets (no repo-level secrets needed):
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#
# FILL IN BEFORE FIRST PUSH: AZURE_WEBAPP_NAME, STAGING_MODE, RUNTIME below
# (values are printed by deploy.sh after the first manual deployment).
#
# All actions are pinned to full commit SHAs (supply-chain hardening). Update
# deliberately; the trailing comment records the human-readable version.
# =============================================================================
name: deploy

on:
  push:
    branches: [main] # push to main deploys PRODUCTION
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

permissions:
  id-token: write # OIDC token for azure/login
  contents: read

env:
  AZURE_WEBAPP_NAME: "CHANGE-ME" # e.g. ghr-timesheet (terraform output web_app_name)
  STAGING_MODE: "slot" # slot = staging slot on S1+ plan; app = separate <name>-staging web app
  RUNTIME: "node" # node | python
  ARTIFACT_NAME: "app-zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        if: env.RUNTIME == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Python
        if: env.RUNTIME == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install and build (node)
        if: env.RUNTIME == 'node'
        run: |
          npm ci
          npm run build --if-present

      - name: Install dependencies (python)
        if: env.RUNTIME == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Package artifact
        shell: bash
        run: |
          zip -r app.zip . \
            -x 'node_modules/*' \
            -x '.git/*' \
            -x '__pycache__/*' \
            -x '*/__pycache__/*' \
            -x 'venv/*' \
            -x '.venv/*' \
            -x 'app.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app.zip
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Resolve deploy target
        id: target
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target || 'production' }}
        run: |
          # push to main -> production; workflow_dispatch -> the chosen target.
          # slot mode: staging = slot named 'staging'; production = the app itself
          #            (slot-name EMPTY — never the literal 'production').
          # app mode:  staging = separate web app '<name>-staging'; production = '<name>'.
          if [[ "$REQUESTED_TARGET" == "staging" ]]; then
            if [[ "$STAGING_MODE" == "slot" ]]; then
              echo "app_name=$AZURE_WEBAPP_NAME" >> "$GITHUB_OUTPUT"
              echo "slot_name=staging" >> "$GITHUB_OUTPUT"
            else
              echo "app_name=${AZURE_WEBAPP_NAME}-staging" >> "$GITHUB_OUTPUT"
              echo "slot_name=" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "app_name=$AZURE_WEBAPP_NAME" >> "$GITHUB_OUTPUT"
            echo "slot_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ steps.target.outputs.app_name }}
          slot-name: ${{ steps.target.outputs.slot_name }}
          package: app.zip
